name: "Financial Report Deep-Dive (Mock)"
description: "Mock-mode variant. Trial balance drill-down, negative balances, comparisons, trends"
tags: [negative_balances, drill_down, formatting, coherence, mock]

turns:
  - query: "Show me the trial balance for FY 2025-26"
    expect:
      query_type: simple_lookup
      has_data: true
      has_chart: true
      chart_type: bar
      ground_truth_key: trial_balance
      checks:
        - "Response mentions debit and credit totals"
        - "Negative balances shown with minus sign, not parentheses"
        - "Indian rupee formatting used with ₹ symbol"

  - query: "Which ledgers have negative closing balance?"
    expect:
      query_type: top_n
      has_data: true
      checks:
        - "Lists ledgers with negative balances correctly"
        - "Explains what negative balance means in accounting context"

  - query: "What's the total of all expense ledgers?"
    expect:
      query_type: aggregation
      has_data: true
      checks:
        - "Total is computed correctly from expense ledgers"
        - "Amount is formatted in Indian notation"

  - query: "Compare the top 3 expense ledgers"
    expect:
      query_type: comparison
      has_data: true
      has_chart: true
      chart_type: [grouped_bar, bar]
      checks:
        - "Comparison uses data consistent with prior turns"
        - "All 3 ledgers are actual expense ledgers"

  - query: "Show me monthly trend for the largest expense from October to March"
    expect:
      query_type: trend
      has_chart: true
      chart_type: line
      checks:
        - "References the correct ledger from previous comparison"
        - "Trend data has at least 3 data points"
        - "Chart shows time on X-axis"

  - query: "What percentage of total expenses does it represent?"
    expect:
      query_type: aggregation
      checks:
        - "Uses the same ledger from the previous turn"
        - "Percentage calculation is mathematically correct"
        - "References the total from turn 3"

  - query: "List all stock items with their current quantities and values"
    expect:
      query_type: simple_lookup
      has_data: true
      checks:
        - "Lists stock items from multiple groups (Electronics, Peripherals, Office Supplies)"
        - "Shows quantity with unit of measurement (UOM)"
        - "Shows closing value with Indian rupee formatting"

  - query: "Show me the chart of accounts group hierarchy"
    expect:
      query_type: simple_lookup
      has_data: true
      checks:
        - "Shows account groups with parent-child relationships"
        - "Includes major groups like Assets, Liabilities, Income, Expenses"
        - "Indicates parent group for each sub-group"

  - query: "Show the cash flow statement for FY 2025-26"
    expect:
      query_type: simple_lookup
      has_data: true
      checks:
        - "Breaks down cash flow into operating, investing, and financing activities"
        - "Shows net cash from each activity section"
        - "Uses Indian rupee formatting for amounts"

  - query: "Show all payments made in January 2026"
    expect:
      query_type: simple_lookup
      has_data: true
      checks:
        - "Lists payment vouchers for January 2026"
        - "Shows payee names and payment amounts"
        - "Shows voucher dates within January 2026"

  - query: "Show all receipts received in January 2026"
    expect:
      query_type: simple_lookup
      has_data: true
      checks:
        - "Lists receipt vouchers for January 2026"
        - "Shows party names and receipt amounts"
        - "Shows voucher dates within January 2026"
