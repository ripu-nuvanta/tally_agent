[project]
name = "tally-bi-v2"
version = "0.0.1"
description = "BI Part 1 (syncing) built as v2 beside the current code — see docs/specs/2026-09-21-bi-part1-sync-design.md §5."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
